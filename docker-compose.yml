services:
  obs-ingestion-proxy:
    image: nginx:1.27-alpine
    container_name: obs-ingestion-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - victoriametrics
    networks:
      - observability-net

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    restart: unless-stopped
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=30d"
      - "-httpListenAddr=:8428"
    volumes:
      - ./data/victoriametrics:/victoria-metrics-data
    networks:
      - observability-net

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - victoriametrics
    networks:
      - observability-net

  vmalert:
    image: victoriametrics/vmalert:latest
    container_name: vmalert
    restart: unless-stopped
    command:
      - "-datasource.url=http://victoriametrics:8428"
      - "-remoteRead.url=http://victoriametrics:8428"
      - "-remoteWrite.url=http://victoriametrics:8428"
      - "-notifier.url=http://vmalertmanager:9093"
      - "-rule=/etc/vmalert/rules/*.yml"
      - "-httpListenAddr=:8880"
    volumes:
      - ./configs/vmalert/rules:/etc/vmalert/rules:ro
    ports:
      - "127.0.0.1:8880:8880"
    depends_on:
      - victoriametrics
      - vmalertmanager
    networks:
      - observability-net

  vmalertmanager:
    image: prom/alertmanager:latest
    container_name: vmalertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=:9093"
    volumes:
      - ./configs/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - observability-net

  postgres:
    image: postgres:16-alpine
    container_name: observability-postgres
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observability-net

  admin-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admin-backend
    restart: unless-stopped
    profiles:
      - app
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
      APP_TIMEZONE: Asia/Ho_Chi_Minh

      APP_PUBLIC_PORTAL_URL: ${PUBLIC_PORTAL_URL}
      APP_PUBLIC_GRAFANA_URL: ${PUBLIC_GRAFANA_URL}
      APP_PUBLIC_INGEST_URL: ${PUBLIC_INGEST_URL}
      PUBLIC_PORTAL_URL: ${PUBLIC_PORTAL_URL}
      PUBLIC_GRAFANA_URL: ${PUBLIC_GRAFANA_URL}
      PUBLIC_INGEST_URL: ${PUBLIC_INGEST_URL}

      APP_AGENT_PACKAGE_DIR: /app/packages/agent
      APP_AGENT_SOURCE_DIR: /app/packages
      JWT_SECRET: ${JWT_SECRET}
      SERVER_SECRET: ${SERVER_SECRET}

      GRAFANA_INTERNAL_URL: http://grafana:3000
      VICTORIAMETRICS_INTERNAL_URL: http://victoriametrics:8428
      ALERTMANAGER_INTERNAL_URL: http://vmalertmanager:9093
      VMALERT_RULES_FILE: /app/configs/vmalert/rules/portal-alert-rules.yml
      VMALERT_RELOAD_URL: http://vmalert:8880/-/reload
    volumes:
      - ./packages:/app/packages
      - ./configs/vmalert/rules:/app/configs/vmalert/rules
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      grafana:
        condition: service_started
      victoriametrics:
        condition: service_started
      vmalert:
        condition: service_started
    networks:
      - observability-net

  admin-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: admin-frontend
    restart: unless-stopped
    profiles:
      - app
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_GRAFANA_BASE_URL: ${VITE_GRAFANA_BASE_URL}
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - admin-backend
    networks:
      - observability-net

networks:
  observability-net:
    driver: bridge
